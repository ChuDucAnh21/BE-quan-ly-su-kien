spring:
  application:
    name: EventManagementBackend
  profiles:
    active: local
  jpa: # cấu hình jpa
    hibernate:
      ddl-auto: update # Hibernate tự sinh bảng hoặc update field trong database
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true # Đợi Hibernate tạo xong cấu trúc rồi mới chạy SQL script
  jackson:
    serialization:
      write-dates-as-timestamps: false # Trả về dạng chuỗi ISO thay vì mảng số

